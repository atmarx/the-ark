# medium.yml — "The Mostly Harmless Edition"
# The complete foundation loadout from the-ark spec.
# ~445 GB of ZIMs as of 2026-10, targeting 465 GiB usable on a 500 GB drive.

loadout: medium
description: "Wikipedia with images, Project Gutenberg, medical, field manuals, textbooks"
target_size_gb: 465

zim:
  # ── Tier 1: Foundation of All Human Knowledge (~165 GB) ──────────────

  - name: wikipedia_en_all
    flavour: maxi
    tier: foundation
    note: "Full English Wikipedia with images — the single most valuable file on the drive"

  - name: wikipedia_en-simple_all
    flavour: maxi
    tier: foundation
    note: "Simple English Wikipedia — 10-year-old reading level, ESL-friendly"

  - name: wikipedia_en_medicine
    flavour: maxi
    tier: foundation
    note: "WikiMed — 65,000+ curated medical articles with images"

  - name: medlineplus.gov_en_all
    tier: foundation
    note: "U.S. National Library of Medicine — diseases, drugs, lab tests"

  - name: gutenberg_en_all
    tier: foundation
    note: "Project Gutenberg — 50,000+ public domain books"

  # ── Tier 2: Practical Survival Knowledge (~25 GB) ────────────────────

  - name: ifixit_en_all
    tier: survival
    note: "iFixit — step-by-step repair guides, illustrated"

  - name: wikibooks_en_all
    flavour: maxi
    tier: survival
    note: "Open textbooks — cooking, engineering, languages, programming"

  - name: wikivoyage_en_all
    flavour: maxi
    tier: survival
    note: "World travel guide / gazetteer of every notable place on Earth"

  # ── Tier 3: How to Actually Do Things (~30 GB) ──────────────────────

  - name: diy.stackexchange.com_en_all
    tier: practical
    note: "Home Improvement — how to fix everything in your house"

  - name: gardening.stackexchange.com_en_all
    tier: practical
    note: "Growing food"

  - name: cooking.stackexchange.com_en_all
    tier: practical
    note: "Seasoned Advice — preparing food"

  - name: biology.stackexchange.com_en_all
    tier: practical
    note: "Understanding the living world"

  - name: chemistry.stackexchange.com_en_all
    tier: practical
    note: "Understanding the material world"

  - name: physics.stackexchange.com_en_all
    tier: practical
    note: "Understanding the physical world"

  - name: math.stackexchange.com_en_all
    tier: practical
    note: "Mathematics"

  - name: electronics.stackexchange.com_en_all
    tier: practical
    note: "Building and repairing circuits"

  - name: engineering.stackexchange.com_en_all
    tier: practical
    note: "Applied physics for infrastructure"

  - name: sustainability.stackexchange.com_en_all
    tier: practical
    note: "Living without the grid"

  - name: outdoors.stackexchange.com_en_all
    tier: practical
    note: "Surviving outside"

  - name: astronomy.stackexchange.com_en_all
    tier: practical
    note: "Navigating by stars, understanding the sky"

  - name: history.stackexchange.com_en_all
    tier: practical
    note: "Understanding how we got here"

  - name: law.stackexchange.com_en_all
    tier: practical
    note: "How civilizations organize rules"

  # ── Tier 3b: Field Manual (~14 GB) ──────────────────────────────────
  # Added 2026-10-08.  Small files with a lot of value per byte.

  # WikEM is gone: not in the catalog (2026-11-01) or anywhere on the mirror
  # (val, 2026-11-07), and no Ark we've inspected ever carried it.  Restore
  # the entry if it comes back.  — Zim
  # - name: wikem_en_all
  #   flavour: maxi
  #   tier: field
  #   note: "WikEM: emergency medicine reference written by ER clinicians"

  - name: irp.fas.org_en_military-medicine
    tier: field
    note: "Military medicine manuals: field and trauma care"

  - name: zimgit-medicine_en
    tier: field
    note: "Curated austere-medicine library"

  - name: zimgit-water_en
    tier: field
    note: "Finding, purifying, and storing water"

  - name: zimgit-food-preparation_en
    tier: field
    note: "Food preparation and preservation"

  - name: zimgit-post-disaster_en
    tier: field
    note: "Post-disaster recovery guides"

  - name: zimgit-knots_en
    tier: field
    note: "Knots"

  - name: www.ready.gov_en
    tier: field
    note: "FEMA's Ready.gov: emergency plans, kits, and the first 72 hours"

  - name: armypubs_en_all
    tier: field
    note: "US Army publications: field manuals for survival, first aid, water, shelter"

  - name: appropedia_en_all
    flavour: maxi
    tier: field
    note: "Appropriate technology: building what you need with what you have"

  - name: energypedia_en_all
    flavour: maxi
    tier: field
    note: "Off-grid energy: solar, biogas, micro-hydro, cookstoves"

  - name: solar.lowtechmagazine.com_mul_all
    tier: field
    note: "Low-tech Magazine: older and simpler ways to do things"

  # ── Tier 3c: More Stack Exchange, hands-on trades (~2 GB) ───────────

  - name: ham.stackexchange.com_en_all
    tier: practical
    note: "Amateur radio"

  - name: mechanics.stackexchange.com_en_all
    tier: practical
    note: "Motor vehicle maintenance and repair"

  - name: bicycles.stackexchange.com_en_all
    tier: practical
    note: "Bicycle repair and riding"

  - name: woodworking.stackexchange.com_en_all
    tier: practical
    note: "Woodworking"

  - name: crafts.stackexchange.com_en_all
    tier: practical
    note: "Arts and crafts"

  - name: homebrew.stackexchange.com_en_all
    tier: practical
    note: "Homebrewing and fermentation"

  - name: medicalsciences.stackexchange.com_en_all
    tier: practical
    note: "Medical sciences Q&A"

  - name: parenting.stackexchange.com_en_all
    tier: practical
    note: "Parenting"

  - name: pets.stackexchange.com_en_all
    tier: practical
    note: "Animal care"

  - name: lifehacks.stackexchange.com_en_all
    tier: practical
    note: "Lifehacks"

  - name: 3dprinting.stackexchange.com_en_all
    tier: practical
    note: "3D printing: making replacement parts"

  - name: raspberrypi.stackexchange.com_en_all
    tier: practical
    note: "Raspberry Pi: small, low-power computers"

  - name: arduino.stackexchange.com_en_all
    tier: practical
    note: "Arduino: microcontrollers for sensors, pumps, and automation"

  # ── Tier 4: Education & Culture (~30 GB) ─────────────────────────────

  - name: freecodecamp_en_all
    tier: education
    note: "Full programming curriculum"

  - name: phet_en_all
    tier: education
    note: "PhET — interactive science simulations for kids"

  - name: wiktionary_en_all
    flavour: nopic
    tier: education
    note: "Complete dictionary with etymologies, pronunciations, translations (nopic — no maxi available)"

  # HOLD: the 2026-09 build lost 81% of its articles (4.6M -> 858k).  Keep the
  # last full builds, which are on download.kiwix.org but no longer in the catalog:
  # maxi 2026-05 (19.7 GB), nopic 2026-08 (12.1 GB).  Don't let freshen/sync take
  # a newer one until the article count comes back.  — Zim, 2026-10-13
  - name: wikisource_en_all
    flavour: maxi
    tier: education
    note: "Primary source documents — constitutions, treaties, historical speeches"

  - name: wikiquote_en_all
    flavour: maxi
    tier: education
    note: "Quotations with sources"

  # ── Tier 4b: Textbooks (~12 GB) ──────────────────────────────────────
  # Added 2026-10-08.

  - name: libretexts.org_en_med
    tier: education
    note: "LibreTexts Medicine: anatomy, physiology, nursing, pharmacology"

  - name: libretexts.org_en_bio
    tier: education
    note: "LibreTexts Biology"

  - name: libretexts.org_en_chem
    tier: education
    note: "LibreTexts Chemistry"

  - name: libretexts.org_en_phys
    tier: education
    note: "LibreTexts Physics"

  - name: libretexts.org_en_math
    tier: education
    note: "LibreTexts Mathematics"

  - name: libretexts.org_en_stats
    tier: education
    note: "LibreTexts Statistics"

  - name: libretexts.org_en_eng
    tier: education
    note: "LibreTexts Engineering"

  - name: libretexts.org_en_geo
    tier: education
    note: "LibreTexts Geosciences: soil, water, weather"

  - name: libretexts.org_en_workforce
    tier: education
    note: "LibreTexts Workforce: HVAC, welding, construction, electrical"

  - name: libretexts.org_en_k12
    tier: education
    note: "LibreTexts K-12"

  - name: wikiversity_en_all
    flavour: maxi
    tier: education
    note: "Wikiversity: open courses and learning projects"

  - name: vikidia_en_all
    flavour: maxi
    tier: education
    note: "Vikidia: encyclopedia written for ages 8 to 13"

  # ── Tier 5: Maps & Reference (~30 GB) ────────────────────────────────

  - prefix: devdocs_en_
    tier: reference
    note: "DevDocs — documentation for 100+ programming languages and tools (~223 small ZIMs, ~600 MB total)"

# ── PDFs: The 'Rebuild Civilization' Shelf ──────────────────────────────

pdfs:
  # ── Medical ──
  - url: "https://hesperian.org/wp-content/uploads/pdf/en_wtnd_2025/en_wtnd_2025_{fm,toc,01..23}.pdf"
    filename: "Where_There_Is_No_Doctor_2025.pdf"
    note: "Combined from 25 chapter PDFs — Hesperian 2025 edition"

  - url: "https://hesperian.org/wp-content/uploads/pdf/en_dent_2024/en_dent_2024_{fm,01..12}.pdf"
    filename: "Where_There_Is_No_Dentist_2024.pdf"
    note: "Combined from 13 chapter PDFs — Hesperian 2024 edition"

  # ── Survival & Practical ──
  - url: "https://humanurehandbook.com/downloads/Humanure_Handbook_all.pdf"
    filename: "survival/Humanure_Handbook.pdf"
    note: "Joseph Jenkins — composting human waste safely. Essential sanitation reference."

  # TODO: FM 21-76 US Army Survival Manual (archive.org, currently 503)
  # TODO: Seed saving guide (freely licensed)
  # TODO: Water purification / sanitation guide

  # ── Foundational Documents ──
  - url: "https://www.ohchr.org/sites/default/files/UDHR/Documents/UDHR_Translations/eng.pdf"
    filename: "foundational/Universal_Declaration_of_Human_Rights.pdf"
    note: "UN OHCHR — the foundation of international human rights law"

  # TODO: Geneva Conventions (ICRC PDF)
  # TODO: UN Convention on the Rights of the Child

  # ── Open Source Licenses ──
  # Staged as plain text files in pdfs/licenses/
  # GPL v2, GPL v3, MIT, BSD-3-Clause, Apache 2.0,
  # CC BY 4.0, CC BY-SA 4.0, MPL 2.0

# ── shame/ — Accountability Archives ────────────────────────────────────
# Public court documents, government releases, and records of institutional
# failure. Because a real archive includes the parts we have to reckon with.

archives:
  - id: compiled_epstein_files
    dest: shame
    source: archive.org
    note: "Compiled court documents, flight logs, and related filings"

  - id: jeffrey-epstein-files-full
    dest: shame
    source: archive.org
    note: "Full document collection"

  - id: jeffrey-epstein-part-22-of-22_20250227_2148
    dest: shame
    source: archive.org
    note: "FBI documents — 22 parts, FOIA release"

# ── Linux ISOs — Boot from bare metal ──────────────────────────────────
# Every supported major version. Because knowledge needs an OS to run on.
# Torrents staged to /mnt/nas-downloads/linux/torrents/ (separate qBT watch)

isos:
  # Debian — stable workhorse, offline-installable DVD
  - torrent_url: "https://cdimage.debian.org/cdimage/archive/latest-oldstable/amd64/bt-dvd/debian-12.15.0-amd64-DVD-1.iso.torrent"
    note: "Debian 12 Bookworm (oldstable) — LTS until 2028"

  - torrent_url: "https://cdimage.debian.org/cdimage/release/current/amd64/bt-dvd/debian-13.7.0-amd64-DVD-1.iso.torrent"
    note: "Debian 13 Trixie (stable) — current release"

  # Rocky Linux — RHEL-compatible, enterprise/server
  - torrent_url: "https://download.rockylinux.org/pub/rocky/10/isos/x86_64/Rocky-10.2-x86_64-minimal.torrent"
    note: "Rocky 10.2 (RHEL 10 compatible) — supported until 2035"

  - torrent_url: "https://download.rockylinux.org/pub/rocky/9/isos/x86_64/Rocky-9.8-x86_64-minimal.torrent"
    note: "Rocky 9.8 (RHEL 9 compatible) — supported until 2032"

  # Arch Linux — rolling release, build anything
  - torrent_url: "https://archlinux.org/releng/releases/2026.10.01/torrent/"
    note: "Arch Linux 2026.10 — rolling release, latest snapshot"

  # Tails — privacy OS, boots from USB (direct download, no official torrent)
  - url: "https://download.tails.net/tails/stable/tails-amd64-7.14/tails-amd64-7.14.iso"
    note: "Tails 7.14 — privacy-focused OS, boots from USB, no install needed"

# ── Kiwix Platform Binaries ─────────────────────────────────────────────

kiwix_platforms:
  - desktop    # Linux AppImage + Windows zip
  - android    # APK
  - macos      # DMG
  - tools      # kiwix-serve (Linux x86_64, aarch64, Windows)
