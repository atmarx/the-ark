# deep-thought.yml — the LLM expansion pack
# Local language models plus llama.cpp, laid on top of a stamped drive:
#   ark sync deep-thought
#   ark stamp mega /dev/sdX --pack=deep-thought      # new drive
#   ark clone deep-thought /media/THE-ARK            # existing drive
#
# Stock releases only: first-party weights, or a straight quantization of
# them.  No fine-tunes, merges, distills, or decensored variants.  Every file
# is pinned to a Hugging Face revision and checked against its sha256.
#
# A model paraphrases; a ZIM cites.  The pack is a way into the library, not
# a replacement for it.
#
# ~75 GB (69 GiB).  Mega plus this pack fits a 2 TB drive with room to spare.

loadout: deep-thought
pack: true
description: "Local language models and llama.cpp, for any drive with 75 GB free"
target_size_gb: 75

# ram_gb: smallest total system RAM the model is comfortable in.
# auto:   the launcher picks the largest auto model that fits.  The two dense
#         ~30B models are opt-in because they're slow without a GPU.
